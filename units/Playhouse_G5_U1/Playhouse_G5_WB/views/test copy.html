<!DOCTYPE html>
<html>
<head>
    <style>
        /* Style for the main container */
        .flex-container {
            display: flex;
            flex-direction: column; /* Arrange children vertically */
        }

        /* Style for each row */
        .flex-row {
            display: flex;
            flex-direction: row; /* Arrange children horizontally */
        }

        /* Style for each cell */
        .flex-cell {
            flex: 1; /* Distribute equal space among columns */
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        /* Style for input fields */
        input {
            width: 100%;
        }

        /* Style for the vertical text */
        .vertical-text {
            writing-mode: vertical-rl; /* Vertical text from right to left */
            text-orientation: upright;
        }
        /* Media query for smaller screens */
        @media (max-width: 768px) {
            .flex-container {
                flex-direction: column;
            }

            .flex-row {
                flex-direction: column;
            }

            .flex-cell {
                flex: auto; /* Adjust the flex property for smaller screens */
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-row">
            <div class="flex-cell">
                <div class="vertical-text">1</div>
                <input type="text">
                <div class="vertical-text">Text 1</div>
            </div>
            <div class="flex-cell">
                <div class="vertical-text">2</div>
                <input type="text">
                <div class="vertical-text">Text 2</div>
            </div>
            <div class="flex-cell">

            </div>
            <div class="flex-cell">
                <div class="vertical-text">4</div>
                <input type="text">
                <div class="vertical-text">Text 4</div>
            </div>
            <div class="flex-cell">
                <div class="vertical-text">5</div>
                <input type="text">
                <div class="vertical-text">Text 5</div>
            </div>
        </div>
        <div class="flex-row">
            <div class="flex-cell">
                <div class="vertical-text">6</div>
                <input type="text">
                <div class="vertical-text">Text 6</div>
            </div>
            <div class="flex-cell">

            <div class="flex-cell">

            <div class="flex-cell">

</body>
</html>
